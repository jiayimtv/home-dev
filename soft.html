


<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>软件列表-无忧软件</title>
</head>
<style>
@charset "utf-8";

*{
	margin: 0;
	padding: 0;
}
body,html{
	width: 100%;
	height: 100%;
}
body{
	background: #ff6500;
	font-family: "微软雅黑";
}
.notice-wrap{
	padding-top: 30px;
}
.notice{
	margin: 0 auto;
	width: 682px;
	height: 633px;
	background: url(image/update-bg.png) no-repeat;
}
.notice h1{
	padding-top: 225px;
	font-size: 36px;
	color: #333;
	text-align: center;
}
.notice>p{
	margin: 0 62px;
	font-size: 18px;
	color: #666;
	text-indent: 36px;
	line-height: 40px;
}
p span{
	color: #ff6500;
}
.notice .notice-cont{
	margin-top: 45px;
}
.notice .notice-tel{
	padding-bottom: 54px;
	border-bottom: 2px solid #f2f2f2;
}
.notice-foot{
	margin-top: 24px;
}
.notice-foot p{
	font-size: 18px;
	color: #666;
	text-align: center;}
</style>
<body>
	<div class="notice-wrap">
		<div class="notice">
			<h1>软件列表页面更新通知</h1>
			<p class="notice-cont">尊敬的访客您好！<span> USB锁软件列表 </span>已经换到金山文档更新了！</p>
			<p class="notice-tel">将在10秒后自动跳转到新列表页面。 <span>感谢您对我们的的支持！</span></p>
						<div class="notice-foot">
			
<span class="time"></span>
    <p>
        <span id="time"> 10 </span> 秒后跳转到新列表页面
    </p>

<script>
    var second=10;
    var time = document.getElementById("time");
    function show() {
        second--;
        if(second==0){
            //跳转页面
            location.href="https://www.kdocs.cn/l/cntROb1v3sn3";
        }
        //用来动态设置里面的内容
        time.innerHTML=second+"";

    }
    //用来实现这个一秒实现一次这个方法
    setInterval(show,1000);
    

</script>    <p>
        <span id="time"> <a href="/">返回首页</a></span> 
    </p>
			</div>

		</div>
	</div>
</body>
</html>
